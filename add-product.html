<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Product — MARTEY Seller</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #080808;
            --card: #111114;
            --card2: #15151a;
            --border: rgba(255,255,255,.08);
            --text: #f5f5f5;
            --muted: #96969f;
            --purple: #8B5CF6;
            --purple-dark: #7044d8;
        }

        body {
            font-family: "DM Sans", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .add-product-header {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom: 1px solid var(--border);
            background: #0b0b0d;
        }

        .logo {
            text-decoration: none;
            color: white;
            font-family: Manrope, sans-serif;
            font-size: 24px;
            font-weight: 800;
        }

        .logo span {
            color: var(--purple);
        }

        .back-button {
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            padding: 9px 14px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .page {
            max-width: 1100px;
            margin: auto;
            padding: 35px 22px 60px;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .eyebrow {
            color: var(--purple);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        h1 {
            font-family: Manrope, sans-serif;
            font-size: 30px;
            margin-top: 7px;
        }

        .page-heading p {
            color: var(--muted);
            margin-top: 6px;
            font-size: 14px;
        }

        .product-form {
            display: grid;
            gap: 18px;
        }

        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        .form-card h2 {
            font-family: Manrope, sans-serif;
            font-size: 17px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 17px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: #d8d8dd;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid var(--border);
            background: #0b0b0e;
            color: white;
            border-radius: 9px;
            padding: 12px;
            outline: none;
            font-family: inherit;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: rgba(139,92,246,.7);
        }

        .image-upload {
            border: 1px dashed rgba(139,92,246,.45);
            background: rgba(139,92,246,.05);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
        }

        .image-upload strong {
            display: block;
            margin-bottom: 6px;
        }

        .image-upload p {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 15px;
        }

        .image-upload input {
            border: none;
            background: transparent;
            padding: 0;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .cancel-btn,
        .submit-btn {
            padding: 12px 20px;
            border-radius: 9px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .cancel-btn {
            background: var(--card2);
            color: white;
            border: 1px solid var(--border);
        }

        .submit-btn {
            border: none;
            background: var(--purple);
            color: white;
        }

        .submit-btn:hover {
            background: var(--purple-dark);
        }

        @media (max-width: 700px) {

            .add-product-header {
                padding: 0 15px;
            }

            .page {
                padding: 25px 14px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .form-actions {
                flex-direction: column;
            }

            .cancel-btn,
            .submit-btn {
                width: 100%;
            }

        }

    </style>

</head>

<body>

<header class="add-product-header">

    <a
        href="seller.html"
        class="logo"
    >
        MARTEY<span>.</span>
    </a>

    <button
        class="back-button"
        onclick="window.location.href='seller.html'"
    >
        ← Back to Seller
    </button>

</header>


<main class="page">

    <div class="page-heading">

        <span class="eyebrow">
            PRODUCT CATALOG
        </span>

        <h1>
            Add Product
        </h1>

        <p>
            Add a new product to your MARTEY store.
        </p>

    </div>


    <form
        class="product-form"
        id="productForm"
    >

        <!-- BASIC INFORMATION -->

        <div class="form-card">

            <h2>
                Basic Information
            </h2>

            <div class="form-grid">

                <div class="form-group full">

                    <label>
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <select
                        id="productCategory"
                        required
                    >

                        <option value="">
                            Select category
                        </option>

                        <option>
                            Fashion
                        </option>

                        <option>
                            Electronics
                        </option>

                        <option>
                            Home
                        </option>

                        <option>
                            Beauty
                        </option>

                        <option>
                            Accessories
                        </option>

                        <option>
                            Sports
                        </option>

                        <option>
                            Gaming
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Brand
                    </label>

                    <input
                        type="text"
                        id="productBrand"
                        placeholder="Brand name"
                    >

                </div>


                <div class="form-group full">

                    <label>
                        Product Description
                    </label>

                    <textarea
                        id="productDescription"
                        placeholder="Describe your product..."
                        required
                    ></textarea>

                </div>

            </div>

        </div>


        <!-- IMAGES -->

        <div class="form-card">

            <h2>
                Product Images
            </h2>

            <div class="image-upload">

                <strong>
                    Upload Product Images
                </strong>

                <p>
                    Add clear images of your product.
                </p>

                <input
                    type="file"
                    id="productImages"
                    accept="image/*"
                    multiple
                >

            </div>

        </div>


        <!-- PRICE -->

        <div class="form-card">

            <h2>
                Pricing & Inventory
            </h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Selling Price (₹)
                    </label>

                    <input
                        type="number"
                        id="sellingPrice"
                        min="0"
                        placeholder="799"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        MRP (₹)
                    </label>

                    <input
                        type="number"
                        id="mrp"
                        min="0"
                        placeholder="1299"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Stock Quantity
                    </label>

                    <input
                        type="number"
                        id="stock"
                        min="0"
                        placeholder="50"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        SKU
                    </label>

                    <input
                        type="text"
                        id="sku"
                        placeholder="MT-1001"
                    >

                </div>

            </div>

        </div>


        <!-- VARIANTS -->

        <div class="form-card">

            <h2>
                Variants
            </h2>

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Available Sizes
                    </label>

                    <input
                        type="text"
                        id="sizes"
                        placeholder="S, M, L, XL"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Available Colors
                    </label>

                    <input
                        type="text"
                        id="colors"
                        placeholder="Black, White"
                    >

                </div>

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="form-actions">

            <button
                type="button"
                class="cancel-btn"
                onclick="window.location.href='seller.html'"
            >
                Cancel
            </button>

            <button
                type="submit"
                class="submit-btn"
            >
                Publish Product
            </button>

        </div>

    </form>

</main>


<script>

    const productForm =
        document.getElementById("productForm");


    productForm.addEventListener(
        "submit",
        event => {

            event.preventDefault();


            alert(
                "Product form is ready. Database connection will publish this product to MARTEY."
            );

        }
    );

</script>

</body>

</html>
